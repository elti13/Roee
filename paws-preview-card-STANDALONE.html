<style>
.pawsprev{
  /* --- the only two things you'll likely want to change --- */
  --pv-pink:#F1AAAA;
  --pv-ink:#2F2F2F;

  container-type:inline-size;
  position:relative;display:block;overflow:hidden;isolation:isolate;
  width:100%;aspect-ratio:3/4;                /* 4/3 or 1/1 also work */
  border-radius:6cqw;background:var(--pv-pink);
  color:var(--pv-ink);text-decoration:none;
  font-family:"Poppins","Century Gothic",ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;
  box-shadow:0 2cqw 6cqw -3cqw rgba(47,47,47,.35);
  transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s;
  -webkit-tap-highlight-color:transparent;
}
.pawsprev:hover{transform:translateY(-.8cqw);box-shadow:0 4cqw 9cqw -3.5cqw rgba(47,47,47,.45)}
.pawsprev :where(b,i,span){font-style:normal}

/* brand */
.pawsprev__brand{position:absolute;top:6.5cqw;left:7cqw;display:flex;align-items:center;gap:2.2cqw;z-index:3}
.pawsprev__mark{
  width:7.6cqw;height:7.6cqw;border-radius:50%;background:var(--pv-ink);color:var(--pv-pink);
  display:grid;place-items:center;flex:none
}
.pawsprev__mark svg{width:4.6cqw;height:4.6cqw;fill:currentColor}
.pawsprev__brand b{display:block;font-size:4.6cqw;font-weight:600;line-height:1;letter-spacing:-.02em}
.pawsprev__brand i{display:block;font-size:2.2cqw;font-weight:500;letter-spacing:.18em;text-transform:uppercase;opacity:.65;margin-top:.7cqw}

/* headline */
.pawsprev__head{
  position:absolute;top:19cqw;left:7cqw;right:7cqw;z-index:3;
  font-size:11.4cqw;line-height:1.02;font-weight:400;letter-spacing:-.035em
}
.pawsprev__stroke{display:block;width:52cqw;height:2.6cqw;margin-top:1.6cqw;color:#fff;opacity:.9}
.pawsprev__sub{
  position:absolute;top:46cqw;left:7cqw;width:52cqw;z-index:3;
  font-size:3.5cqw;line-height:1.45;font-weight:400;opacity:.85
}
.pawsprev__btn{
  position:absolute;top:60cqw;left:7cqw;z-index:3;
  background:var(--pv-ink);color:#fff;border-radius:99cqw;
  padding:2.6cqw 5cqw;font-size:3.4cqw;font-weight:600;letter-spacing:-.01em
}

/* dog */
.pawsprev__dog{
  position:absolute;right:-5cqw;bottom:-2cqw;height:62%;width:auto;z-index:2;
  filter:drop-shadow(0 2cqw 4cqw rgba(47,47,47,.22))
}

/* booking card */
.pawsprev__cal{
  position:absolute;left:6cqw;bottom:6cqw;width:52cqw;z-index:4;
  background:#fff;border-radius:4.5cqw;padding:4cqw 4cqw 4.4cqw;
  box-shadow:0 3cqw 7cqw -3cqw rgba(47,47,47,.4)
}
.pawsprev__calhead{display:block;font-size:3.2cqw;font-weight:600;letter-spacing:-.02em;margin-bottom:3cqw}
.pawsprev__days{display:grid;grid-template-columns:repeat(4,1fr);gap:1.6cqw}
.pawsprev__days .d{display:block;text-align:center}
.pawsprev__days i{display:block;font-size:1.75cqw;font-weight:600;letter-spacing:.1em;opacity:.5;margin-bottom:1cqw}
.pawsprev__days b{
  display:grid;place-items:center;aspect-ratio:1;border-radius:50%;
  background:#F4F1EE;font-size:3cqw;font-weight:500
}
.pawsprev__days .on b{background:var(--pv-ink);color:#fff}
.pawsprev__times{display:grid;grid-template-columns:1fr 1fr;gap:1.6cqw;margin-top:2.6cqw}
.pawsprev__times span{
  text-align:center;border:1px solid rgba(47,47,47,.18);border-radius:99cqw;
  padding:1.6cqw 0;font-size:2.6cqw;font-weight:500
}

/* hover affordance */
.pawsprev__open{
  position:absolute;right:5cqw;top:6.5cqw;z-index:5;
  background:rgba(255,255,255,.9);border-radius:99cqw;padding:2cqw 3.6cqw;
  font-size:2.7cqw;font-weight:600;white-space:nowrap;
  opacity:0;transform:translateY(-1cqw);transition:opacity .3s,transform .3s
}
.pawsprev:hover .pawsprev__open,
.pawsprev:focus-visible .pawsprev__open{opacity:1;transform:none}

@media (prefers-reduced-motion:reduce){
  .pawsprev,.pawsprev__open{transition:none}
  .pawsprev:hover{transform:none}
}
</style>
